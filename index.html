<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http: ws: wss:; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; media-src 'self' data: blob: https:; child-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com;">
  <title>Wordmark</title>
  <meta name="description" content="Client-side AI assistant built for the OpenAI Responses API and local LM Studio servers.">

  <!-- Additional Meta Tags -->
  <meta name="author" content="Dustin Whyte">
  <meta name="keywords" content="AI assistant, Wordmark, AI chatbot, open source AI, OpenAI Responses, LM Studio, local AI models, client-side AI, chatbot platform, conversational AI, generative AI, large language model, AI privacy, AI security, AI tools">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="application-name" content="Wordmark">
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:title" content="Wordmark - Open Source AI Assistant Platform">
  <meta property="og:description" content="Client-side AI assistant for OpenAI Responses and LM Studio. Runs entirely in your browser.">
  <meta property="og:image" content="">
  <meta property="og:site_name" content="Wordmark">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="">
  <meta name="twitter:title" content="Wordmark - Open Source AI Assistant Platform">
  <meta name="twitter:description" content="Client-side AI assistant for OpenAI Responses and LM Studio. Runs entirely in your browser.">
  <meta name="twitter:image" content="">

  <!-- Mobile Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wordmark">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Link to modular CSS -->
  <link rel="stylesheet" href="/src/css/main.css">

  <!-- Module entrypoint: Vite bundles vendor libs, config, and all app modules -->
  <script type="module" src="/src/ts/main.ts"></script>
</head>
<body>
  <div id="desktop-titlebar" hidden>
    <svg width="15" height="15" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <circle cx="50" cy="50" r="42" stroke="var(--accent-color)" stroke-width="8"/>
      <path d="M28 34 L38 68 L50 46 L62 68 L72 34" stroke="var(--accent-color)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Wordmark</span>
  </div>
  <div id="app-shell">
    <aside id="rail" aria-label="Conversations">
      <div id="rail-brand">
        <!-- Circled W SVG logo for Wordmark -->
        <svg id="wordmark-logo" width="26" height="26" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="var(--accent-color)" stroke-width="1">
            <!-- Logo elements will be generated by logo.ts -->
          </g>
        </svg>
        <span id="logo-wordmark">WORDMARK</span>
        <button id="rail-close" type="button" aria-label="Close menu" title="Close menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#x"></use></svg>
        </button>
      </div>

      <button id="new-chat-button" type="button" title="Start a new conversation">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#plus"></use></svg>
        <span>New chat</span>
      </button>

      <div id="rail-recent-label">Recent</div>
      <div id="rail-conversations"></div>

      <div id="rail-actions">
        <button
          id="history-button"
          type="button"
          aria-label="Open Chat History"
          aria-expanded="false"
          aria-controls="history-panel"
          title="Open Chat History"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#clock"></use></svg>
        </button>
        <button
          id="gallery-button"
          type="button"
          aria-label="Open Media Gallery"
          aria-expanded="false"
          aria-controls="gallery-panel"
          title="Open Media Gallery"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#image"></use></svg>
        </button>
        <button
          id="settings-button"
          type="button"
          aria-label="Open Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
          title="Open Settings"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#settings"></use></svg>
        </button>
      </div>

      <div id="rail-status" title="Change model">
        <i class="rail-status-dot" aria-hidden="true"></i>
        <span id="rail-service-line"></span>
      </div>
    </aside>

    <div id="rail-scrim"></div>

    <div id="chat-container">
      <div id="header">
        <button id="rail-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="rail" title="Open menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#menu"></use></svg>
        </button>
        <div id="header-identity">
          <h1 id="header-title">Wordmark</h1>
          <div id="model-info" class="prompt-container"></div>
        </div>
        <div id="feature-status" class="feature-status" aria-live="polite"></div>
      </div>

      <div id="chat-box" aria-live="polite"></div>

      <div class="input-container">
        <div class="input-wrapper">
          <div class="upload-previews"></div>
          <textarea
            id="user-input"
            placeholder="Ask anything, or attach files…"
            rows="1"
            aria-label="User input"
          ></textarea>
          <div class="composer-actions">
            <button id="upload-button" type="button" aria-label="Attach files" title="Attach files or directory">
              <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#upload"></use></svg>
            </button>
            <span class="composer-hint" aria-hidden="true">⏎ send · ⇧⏎ newline</span>
            <div id="history-meter" class="history-meter" role="img" aria-label="History usage" hidden>
              <span id="history-meter-fill" class="history-meter-fill"></span>
            </div>
            <button id="compact-history-button" class="history-compact-button" type="button" aria-label="Compact conversation history" title="Compact conversation history" hidden></button>
            <input type="file" id="image-upload" accept="image/*,.c,.cpp,.cs,.css,.doc,.docx,.go,.html,.java,.js,.json,.md,.pdf,.php,.pptx,.py,.rb,.sh,.tex,.ts,.txt" multiple style="display:none">
            <input type="file" id="directory-upload" webkitdirectory directory multiple style="display:none">
            <button id="send-button" type="button" aria-label="Send message" title="Send message">
              <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#send"></use></svg>
              <svg class="stop-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" style="display: none;" aria-hidden="true" focusable="false"><use href="#stop"></use></svg>
              <span class="stopping-spinner" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#spinner-circle"></use></svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="panel-scrim"></div>
    <div id="menu-panels-container">
      <!-- All menu panels content will be loaded here -->
    </div>
  </div>
  </body>
</html>
